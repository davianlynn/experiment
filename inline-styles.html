<!DOCTYPE html>
<html>
    <head>
        <title>Inline Styles</title>
    </head>
    <body>
        <h1 style="background-color: green; font-size: 30px; color: #ff0011; color: yellowgreen;">
            Heading <span style="color: blue;">One</span></h1>
        <h2 style="font-size: 30px; color: aquamarine;">Heading 2</h2>
        <h3 style="font-size: 30px; color: red;">Heading 3</h3>
        <h4 style="font-size: 30px; color: darkgoldenrod;">Heading 4</h4>
        <h1 style="font-size: 20px; color: rgba(201, 62, 41, 0.259);">Heading 1</h1>
        <h2 style="font-size: 20px; color: darkgoldenrod; color: darkslateblue;">Heading 2</h2>
        <h3 style="font-size: 20px; color: darkgoldenrod;">Heading 3</h3>
        <h4 style="font-size: 20px; color: darkgoldenrod;">Heading 4</h4>
    </body>

</html>
